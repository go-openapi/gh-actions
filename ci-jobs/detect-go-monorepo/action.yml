name: detect-go-monorepo
description: |
  Detects if a golang git repo is a mono-repo with multiple modules
  and outputs the list of modules with their location with various
  formats (JSON, bash-compatible list).

  Requires: go setup, git checkout

author: go-openapi

outputs:
  is-monorepo:
    description: |
      Indicates if the current repo is a go mono repo.
    value: ${{ steps.detect-monorepo.outputs.is-monorepo }}

  modules-count:
    description: |
      Counts how many modules have been detected.
    value: ${{ steps.detect-monorepo.outputs.modules-count }}

  modules:
    description: |
      A JSON array of modules with name (go import path) and path (folder in the current checkout).
    value: ${{ steps.detect-monorepo.outputs.modules }}

  paths:
    description: |
      A JSON array of modules paths
    value: ${{ steps.detect-monorepo.outputs.paths }}

  relative-names:
    description: |
      A JSON array of modules relative module names (relative imports).
      The root module always yields an empty string.
      These are pure relative paths without leading "." or "/".

      Example: github.com/go-openapi/swag/jsonutils yields "jsonutils"
    value: ${{ steps.detect-monorepo.outputs.relative-names }}

  bash-paths:
    description: |
      A bash-compatible array of modules paths.

      The bash-compatible list is a list of blank separated, unquoted strings.
      It is exposed to classical shell-escaping issues, but reads nicely into a bash array like so:

      mapfile -d' ' -t ALL_FOLDERS < <(printf "%s" "${{ bash-paths }}") # bash 4 syntax

    value: ${{ steps.detect-monorepo.outputs.bash-paths }}

  bash-subpaths:
    description: |
      A bash-compatible array of modules paths with the "/..." suffix.

      The bash-compatible list is a list of blank separated, unquoted strings.
      It is exposed to classical shell-escaping issues.

    value: ${{ steps.detect-monorepo.outputs.bash-subpaths }}

  bash-relative-names:
    description: |
      A bash-compatible array of modules relative names (relative imports).
      The root module always yields the string '{root}'.

      These are pure relative paths without leading "." or "/".

      Example: github.com/go-openapi/swag/jsonutils yields "jsonutils"

      The bash-compatible list is a list of blank separated, unquoted strings.
      It is exposed to classical shell-escaping issues.

    value: ${{ steps.detect-monorepo.outputs.bash-relative-names }}

  names:
    description: |
      A JSON array of modules names (import paths)
    value: ${{ steps.detect-monorepo.outputs.names }}

  root-module:
    description: |
      The name (go import path) of the root module in the go mono repo.
    value: ${{ steps.detect-monorepo.outputs.root-module }}

runs:
  using: composite
  steps:
    -
      name: Detect modules
      id: detect-monorepo
      shell: bash
      run: |
        root=$(go list)
        list=$(go list -m -f '{"name":{{ printf "%q" .Path }},"path":{{ printf "%q" .Dir }}}')
        count=$(echo "${list}"|wc -l)

        # JSON output
        modules=$(echo "${list}"|jq -sc) # single-line JSON
        paths=$(echo "${list}"|jq -sc 'map(.path)')
        names=$(echo "${list}"|jq -sc 'map(.name)')
        relative_names=$(echo "${modules}"|jq -c --arg ROOT "${root}" '[.[]|.name|ltrimstr($ROOT)|ltrimstr("/")]')

        # bash-compatible outputs
        # - space-separated, unquoted strings (like for a bash array). Sensitive to classical shell escaping issues.
        # Might need to add jq filter @sh if escaping becomes a problem, at the expanse of more complex output handling.
        bash_paths=$(echo "${list}" | jq -r '.path'|tr '\n' ' '|sed -E 's/\s{2,}/ /g'|sed -E 's/\s+$//')
        bash_relative_names=$(echo "${modules}"|jq -r --arg ROOT "${root}" '.[]|.name|ltrimstr($ROOT)|ltrimstr("/")|sub("^$";"{root}")'|tr '\n' ' '|sed -E 's/\s+/ /g'|sed -E 's/\s+$//')
        # subpaths are designated to match with go test syntax, e.g. {path}/...
        bash_subpaths=$(echo "${list}" | jq -r '.path+"/..."'|tr '\n' ' '|sed -E 's/\s{2,}/ /g'|sed -E 's/\s+$//')

        echo "modules=${modules}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=modules::${modules}"

        echo "root-module=${root}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=root-module::${root}"

        echo "paths=${paths}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=paths::${paths}"

        echo "bash-paths=${bash_paths}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=bash-subpaths::${bash_paths}"

        echo "bash-subpaths=${bash_subpaths}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=bash-subpaths::${bash_subpaths}"

        echo "names=${names}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=names::${names}"

        echo "modules-count=${count}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=modules-count::${count}"

        echo "relative-name=${relative_names}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=relative-names::${relative_names}"

        echo "bash-relative-name=${bash_relative_names}" >> "${GITHUB_OUTPUT}"
        echo "::notice title=bash_relative-names::${bash_relative_names}"

        if [[ "${count}" -gt 1 ]] ; then
          echo "is-monorepo=true" >> "${GITHUB_OUTPUT}"
          echo "::notice title=is-monorepo::true"
        else
          echo "is-monorepo=false" >> "${GITHUB_OUTPUT}"
          echo "::notice title=is-monorepo::false"
        fi

branding:
  icon: 'key'
  color: 'green'
