name: next-tag
description: |
  Determines the next release bump using svu.

  By default, a patch version bump is issued.

  Requires: checkout

author: go-openapi

inputs:
  bump-patch:
    description: Bump a patch version release
    type: string
    required: false
    default: 'true'
  bump-minor:
    description: Bump a minor version release
    type: string
    required: false
    default: 'false'
  bump-major:
    description: Bump a major version release
    type: string
    required: false
    default: 'false'

outputs:
  next-tag:
    description: |
      The bumped release tag.
    value: ${{ steps.bump-release.outputs.next-tag }}

runs:
  using: composite
  steps:
    -
      name: install svu
      uses: go-openapi/gh-actions/install/svu@22efe2037645eed0102229f2488f22aee042b2a4
    -
      name: Bump release
      id: bump-release
      shell: bash
      env:
        BUMP_PATCH: ${{ inputs.bump-patch }}
        BUMP_MINOR: ${{ inputs.bump-minor }}
        BUMP_MAJOR: ${{ inputs.bump-major }}
      run: |
        # determine next tag to push
        NEXT_TAG=""
        CURRENT=$(svu current)
        if [[ "${CURRENT}" == "v0.0.0" ]] ; then
          # never been tagged before: initialize v0.0.1
          NEXT_TAG="v0.0.1"
        else
          if   [[ "${BUMP_PATCH}" == 'true' ]] ; then
            NEXT_TAG=$(svu patch --tag.pattern 'v*')
          elif [[ "${BUMP_MINOR}" == 'true' ]] ; then
            NEXT_TAG=$(svu minor --tag.pattern 'v*')
          elif [[ "${BUMP_MAJOR}" == 'true' ]] ; then
             NEXT_TAG=$(svu major --tag.pattern 'v*')
          else
            echo "::error::invalid options::One of bump-patch, bump-minor or bump-major must be true"
            exit 1
          fi
        fi

        if [[ -z "${NEXT_TAG}" ]] ; then
          echo "::error::something went wrong and no tag has been determined. Stopping here"
          exit 1
        fi

        echo "next-tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
        echo "::notice title=next-tag::${NEXT_TAG}"
